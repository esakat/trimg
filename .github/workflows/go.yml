name: Go
on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ 'master' ]
jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:

    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Set up Go 1.21
      uses: actions/setup-go@v4
      with:
        go-version: 1.21
        cache: true
      id: go

    - name: Get dependencies
      run: go get -v -t -d ./...

    - name: Test
      run: go test -v ./...

    - name: Build
      run: go build -v .
      
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4
      
    - name: golangci-lint
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
